# ──────────────────────────────────────────────────────────────
#  lemontyc.com — a hand-rolled Jekyll theme, no framework
#  Change things here; the layouts read from this file.
# ──────────────────────────────────────────────────────────────

# Identity
title            : "lemontyc"
tagline          : "Robots, photos, and the occasional thought"
description      : "Luis is a robotics engineer who builds web tools for robots, takes photographs, and writes here roughly once every geological era."
url              : "https://lemontyc.com"
baseurl          : ""
repository       : "lemontyc/lemontyc.github.io"
lang             : "en-US"

author:
  name           : "Luis"
  handle         : "lemontyc"
  # Shown under your name on the homepage and in the footer.
  bio            : "Robotics engineer. Sometime photographer. Currently building web tools for robots, which is precisely the thing I swore I would never do."
  location       : "Somewhere in the vast world"   # ← swap for a real place when you feel like it
  avatar         : # e.g. "/assets/images/me.jpg" — drop a photo in and it appears on the homepage

# Links shown in the footer under "Elsewhere".
# Comment out a line and it disappears. Add one and it shows up.
elsewhere:
  - name : "GitHub"
    url  : "https://github.com/lemontyc"
  - name : "LinkedIn"
    url  : "https://www.linkedin.com/in/lemontyc/"
  # - name : "Email"
  #   url  : "mailto:you@example.com"
  # - name : "Instagram"
  #   url  : "https://instagram.com/"

# Build
permalink        : /:categories/:title/      # unchanged — old links still work
timezone         : America/Mexico_City
encoding         : "utf-8"
markdown         : kramdown
highlighter      : rouge
excerpt_separator: "\n\n"

kramdown:
  input          : GFM
  auto_ids       : true
  smart_quotes   : lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir       : _sass
  style          : compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Needed so a local `--safe` build behaves like the GitHub Pages one.
whitelist:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path           : /feed.xml

include:
  - _pages

exclude:
  - docker          # local preview image, not part of the site
  - .vscode
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .bundle

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
