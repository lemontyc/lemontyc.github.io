---
layout: default
---
<article class="page">
  <header class="page__head wrap wrap--narrow">
    {%- if page.eyebrow %}<p class="page__eyebrow"><span class="prompt">&gt;</span> {{ page.eyebrow }}</p>{%- endif %}
    <h1 class="page__title">{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="page__subtitle">{{ page.subtitle }}</p>{%- endif %}
  </header>

  <div class="prose wrap wrap--narrow">
    {{ content }}
  </div>
</article>
